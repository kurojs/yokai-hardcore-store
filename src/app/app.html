<a class="skip-link" href="#main">Saltar al contenido</a>

<header class="shell__header">
  <div class="page-width shell__bar">
    <a class="brand" routerLink="/" aria-label="Yokai Hardcore Store, ir al inicio">
      <span class="brand__mark" aria-hidden="true">Y</span>
      <span class="brand__text">Yokai Hardcore</span>
    </a>

    <div class="shell__actions">
      <nav class="nav" aria-label="Navegación principal">
        <a
          routerLink="/"
          routerLinkActive="is-active"
          ariaCurrentWhenActive="page"
          [routerLinkActiveOptions]="{ exact: true }"
          >Inicio</a
        >
        <a routerLink="/catalog" routerLinkActive="is-active" ariaCurrentWhenActive="page"
          >Catálogo</a
        >
      </nav>

      <!-- A count, not a control: there is no cart route yet, so this must not navigate. The
           live region announces a change politely without stealing focus from the page. -->
      <p class="cart-indicator" role="status" aria-live="polite">{{ cartLabel() }}</p>
    </div>
  </div>
</header>

<main class="shell__main" id="main">
  <router-outlet />
</main>

<footer class="shell__footer">
  <div class="page-width shell__footer-inner">
    <p class="shell__footer-brand">Yokai Hardcore Store</p>
    <p class="shell__footer-note">Tienda de demostración: ningún pago se procesa.</p>
  </div>
</footer>
