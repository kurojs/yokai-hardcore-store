@if (errorMessage(); as message) {
  <section class="page-width state" role="alert">
    <h2 class="state__title">{{ text().catalogLoadErrorTitle }}</h2>
    <p class="state__message">{{ message }}</p>
    <button type="button" class="button button--primary" (click)="retry()">
      {{ text().retryLabel }}
    </button>
  </section>
} @else if (!isReady()) {
  <p class="page-width state state--loading" aria-live="polite">{{ text().homeLoading }}</p>
} @else {
  <section class="section page-width" id="categorias" aria-labelledby="categorias-title">
    <div class="section__head">
      <h2 id="categorias-title">{{ text().categoriesTitle }}</h2>
    </div>

    <ul class="card-grid" appRevealOnScroll>
      @for (category of categories(); track category.id; let index = $index) {
        <li [style.--reveal-index]="index">
          <a class="card-link" [routerLink]="['/catalog', category.slug]">
            <app-category-card
              [category]="category"
              [productCount]="countIn(category.id)"
              [fallbackImage]="fallbackImageFor(category.id)"
              [text]="text()"
            />
          </a>
        </li>
      }
    </ul>
  </section>
}
